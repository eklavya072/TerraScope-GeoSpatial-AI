name: CI

# Verifies the integrity of what the repository ships. Deliberately does NOT
# retrain or re-benchmark: training is ~8 hours on a GPU and the measurements
# require privileged power telemetry on specific hardware. What CI can check --
# and what actually catches regressions -- is that the committed split, the
# committed results and the README's claims remain mutually consistent.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # the legacy .h5 demo models are not needed here
          # tests/test_provenance.py verifies the commit hashes the docs cite as
          # evidence for the pre-registration. A depth-1 clone has none of that
          # history and every one of those checks would skip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the locked environment
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  integrity:
    name: split and results integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --group dev

      - name: Split file matches its committed hash
        run: |
          cd splits
          shasum -a 256 -c eurosat_split_seed42.csv.sha256

      - name: Derived artefacts regenerate from the raw results
        # summary.json and the tables are DERIVED from results/bench.jsonl and
        # results/runs.jsonl. Regenerating them here means a hand-edited or
        # corrupted summary.json fails CI -- the drift this job exists to catch.
        #
        # check_derived.py rather than `git diff --exit-code`, because a
        # byte-comparison cannot survive a change of platform: scipy's Welch
        # p-values differ in the last ULP between macOS/arm64 and Linux/x86_64
        # (0.0002170793405032607 vs ...606). Ten p-values differ that way and
        # nothing else does. The script requires the PUBLISHED tables and README
        # to be byte-identical -- they round to 4 decimals, so noise cannot reach
        # them -- and summary.json to match structurally and within rel_tol=1e-9,
        # which is six orders of magnitude tighter than any difference that could
        # change a reported figure. tests/test_check_derived.py pins that the
        # tolerance still catches a flipped significance flag, a crossed Holm
        # threshold and a moved accuracy.
        #
        # pareto.png is excluded deliberately: matplotlib output is not
        # byte-identical across platforms either.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run python -m bench.report
          uv run python scripts/render_readme.py
          uv run python scripts/check_derived.py

      - name: Every module imports cleanly
        run: |
          uv run python -c "
          import importlib
          for m in ['bench.config','bench.data','bench.models','bench.train',
                    'bench.export_onnx','bench.benchmark','bench.power',
                    'bench.stats','bench.report','bench.exclusion','bench.utils']:
              importlib.import_module(m)
          print('all bench modules import')
          "

      - name: Shell scripts are valid
        run: bash -n scripts/energy_sampler.sh
