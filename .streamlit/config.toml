# Palette carried over from the original TerraScope interface: deep green on
# off-white. Set here rather than in CSS because Streamlit's own components
# (widgets, tabs, dataframes) read the theme config directly, and overriding
# them with stylesheet rules alone is brittle across releases.
[theme]
base = "light"
primaryColor = "#1b4332"
backgroundColor = "#f8f9ff"
secondaryBackgroundColor = "#eff4ff"
textColor = "#0b1c30"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
