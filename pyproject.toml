[project]
name = "terrascope"
version = "0.1.0"
description = "A reproducible benchmark of the accuracy-energy trade-off for land-cover classification on CPU-only hardware"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # Benchmark core. torch and onnxruntime are pinned exactly: latency and
    # energy figures are only comparable within a fixed runtime version.
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm>=1.0,<2.0",
    "onnx>=1.17,<2.0",
    # torch 2.9's ONNX exporter routes through the dynamo path, which requires
    # onnxscript; without it torch.onnx.export raises ModuleNotFoundError.
    "onnxscript>=0.5,<1.0",
    "onnxruntime==1.29.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.14,<2.0",
    "pillow>=10.0",
    "psutil>=6.0",
    "codecarbon>=2.7,<4.0",
    "matplotlib>=3.9,<4.0",
    "datasets>=3.0",
]

[tool.uv]
package = false

# On Linux, PyPI's torch wheel pulls ~3GB of CUDA runtime packages that this
# project never uses -- every measurement runs on the CPU execution provider by
# design. Pointing Linux resolution at PyTorch's CPU index keeps CI installs
# small and fast. macOS resolution is untouched: its wheels carry no CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
